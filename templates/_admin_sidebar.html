<!-- Ortak Modern Sidebar Bileşeni -->
<!-- Global CSRF Token Meta -->
<meta name="csrf-token" content="{{ csrf_token() }}">

<!-- Mobil Karartma Overlay -->
<div class="sidebar-overlay" id="sidebar-overlay" onclick="toggleMobileSidebar()"></div>

<!-- Modern Açılır/Kapanır Sol Menü (Sidebar) -->
<aside class="sidebar" id="admin-sidebar">
    <div>
        <!-- Sidebar Başlık & Logo -->
        <div class="sidebar-header">
            <a href="/admin" class="sidebar-brand">
                <div class="sidebar-logo">E</div>
                <div class="sidebar-title">
                    <h2>Eczane TV</h2>
                    <span>Yönetim Konsolu</span>
                </div>
            </a>
            <button type="button" class="sidebar-toggle-btn" onclick="toggleSidebarCollapse()" title="Menüyü Daralt / Genişlet">
                ◀
            </button>
        </div>

        <!-- Menü Linkleri -->
        <ul class="sidebar-nav">
            <li>
                <a href="/admin" class="nav-link-item {% if aktif_sayfa == 'dashboard' %}active{% endif %}">
                    <span class="nav-icon">📊</span>
                    <span class="nav-text">Kontrol Paneli</span>
                </a>
            </li>
            <li>
                <a href="/admin/duty-pharmacies" class="nav-link-item {% if aktif_sayfa == 'duty' %}active{% endif %}">
                    <span class="nav-icon">🏥</span>
                    <span class="nav-text">Nöbetçi Eczaneler</span>
                </a>
            </li>
            <li>
                <a href="/admin/logs" class="nav-link-item {% if aktif_sayfa == 'logs' %}active{% endif %}">
                    <span class="nav-icon">📜</span>
                    <span class="nav-text">Cihaz Logları</span>
                </a>
            </li>
            <li>
                <a href="/admin/whatsapp-logs" class="nav-link-item {% if aktif_sayfa == 'whatsapp' %}active{% endif %}">
                    <span class="nav-icon">💬</span>
                    <span class="nav-text">WhatsApp Günlüğü</span>
                </a>
            </li>
            <li>
                <a href="/admin/settings" class="nav-link-item {% if aktif_sayfa == 'settings' %}active{% endif %}">
                    <span class="nav-icon">⚙️</span>
                    <span class="nav-text">Genel Ayarlar</span>
                </a>
            </li>
            <li>
                <a href="/admin/profile" class="nav-link-item {% if aktif_sayfa == 'profile' %}active{% endif %}">
                    <span class="nav-icon">👤</span>
                    <span class="nav-text">Yönetici Profili</span>
                </a>
            </li>
            <li>
                <a href="/admin/help" class="nav-link-item {% if aktif_sayfa == 'help' %}active{% endif %}">
                    <span class="nav-icon">📖</span>
                    <span class="nav-text">Yardım & Kılavuz</span>
                </a>
            </li>
        </ul>
    </div>

    <!-- Sidebar Alt Bar -->
    <div class="sidebar-footer">
        <a href="/admin/logout" class="btn btn-secondary" style="width: 100%; justify-content: center; font-size: 0.85rem; padding: 0.55rem 0.5rem; color: #94a3b8; border-color: rgba(255,255,255,0.08); background: rgba(255,255,255,0.03);">
            <span>🚪</span> <span class="nav-text">Çıkış Yap</span>
        </a>
    </div>
</aside>

<script>
    // Ortak Sidebar Daraltma / Genişletme & Mobil Menü Kontrolleri
    function toggleSidebarCollapse() {
        const sb = document.getElementById('admin-sidebar');
        const btn = document.querySelector('.sidebar-toggle-btn');
        if (sb) {
            sb.classList.toggle('collapsed');
            const isCollapsed = sb.classList.contains('collapsed');
            if (btn) btn.innerHTML = isCollapsed ? '▶' : '◀';
            try {
                localStorage.setItem('admin_sidebar_collapsed', isCollapsed ? '1' : '0');
            } catch(e) {}
        }
    }

    function toggleMobileSidebar() {
        const sb = document.getElementById('admin-sidebar');
        const ov = document.getElementById('sidebar-overlay');
        if (sb && ov) {
            sb.classList.toggle('mobile-open');
            ov.classList.toggle('mobile-open');
        }
    }

    // Sayfa yüklendiğinde kullanıcının son sidebar tercihini hatırla
    document.addEventListener('DOMContentLoaded', () => {
        try {
            if (window.innerWidth > 992 && localStorage.getItem('admin_sidebar_collapsed') === '1') {
                const sb = document.getElementById('admin-sidebar');
                const btn = document.querySelector('.sidebar-toggle-btn');
                if (sb) {
                    sb.classList.add('collapsed');
                    if (btn) btn.innerHTML = '▶';
                }
            }
        } catch(e) {}
    });

    // Otomatik CSRF Token Entegrasyonu (Tüm formlara ve fetch çağrılarına token bağlar)
    (function() {
        function getCsrfToken() {
            const meta = document.querySelector('meta[name="csrf-token"]');
            return meta ? meta.getAttribute('content') : '';
        }

        function injectCsrfInputs() {
            const token = getCsrfToken();
            if (!token) return;
            document.querySelectorAll('form[method="POST"], form[method="post"]').forEach(function(f) {
                if (!f.querySelector('input[name="csrf_token"]')) {
                    const inp = document.createElement('input');
                    inp.type = 'hidden';
                    inp.name = 'csrf_token';
                    inp.value = token;
                    f.appendChild(inp);
                }
            });
        }

        document.addEventListener('DOMContentLoaded', injectCsrfInputs);
        document.addEventListener('submit', function(e) {
            const form = e.target;
            const token = getCsrfToken();
            if (token && form && form.method && form.method.toUpperCase() === 'POST') {
                if (!form.querySelector('input[name="csrf_token"]')) {
                    const inp = document.createElement('input');
                    inp.type = 'hidden';
                    inp.name = 'csrf_token';
                    inp.value = token;
                    form.appendChild(inp);
                }
            }
        }, true);

        const rawFetch = window.fetch;
        window.fetch = function(url, init) {
            init = init || {};
            const method = (init.method || 'GET').toUpperCase();
            if (['POST', 'PUT', 'DELETE', 'PATCH'].includes(method)) {
                const token = getCsrfToken();
                if (token) {
                    if (init.headers instanceof Headers) {
                        if (!init.headers.has('X-CSRFToken')) init.headers.append('X-CSRFToken', token);
                    } else if (Array.isArray(init.headers)) {
                        init.headers.push(['X-CSRFToken', token]);
                    } else {
                        init.headers = init.headers || {};
                        if (!init.headers['X-CSRFToken']) init.headers['X-CSRFToken'] = token;
                    }
                }
            }
            return rawFetch.call(this, url, init);
        };
    })();
</script>
