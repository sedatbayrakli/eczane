<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lisans Bildirimi | Nöbetçi Eczane Kiosk</title>
    <!-- 60 saniyede bir otomatik yenileme (Lisans uzatılınca TV kendiliğinden açılsın) -->
    <meta http-equiv="refresh" content="60">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body {
            background: radial-gradient(circle at center, #0f172a 0%, #080a10 100%);
            color: #f8fafc;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            text-align: center;
        }
        .error-card {
            background: rgba(18, 24, 38, 0.96);
            border: 1.5px solid rgba(239, 68, 68, 0.35);
            border-radius: 24px;
            padding: 2.2rem 2.8rem;
            max-width: 640px;
            width: 100%;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.65), 0 0 35px rgba(239, 68, 68, 0.15);
            box-sizing: border-box;
        }
        .warning-icon {
            width: 58px;
            height: 58px;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 16px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin-bottom: 1rem;
        }
        h1 {
            font-size: 1.45rem;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 0.5rem;
            letter-spacing: -0.01em;
        }
        p {
            font-size: 0.92rem;
            color: #94a3b8;
            line-height: 1.5;
            margin-bottom: 1.4rem;
        }
        .license-box {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 0.75rem 1.5rem;
            border-radius: 12px;
            display: inline-block;
            margin-bottom: 1.4rem;
        }
        .license-label {
            font-size: 0.7rem;
            color: #94a3b8;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            font-weight: 700;
            margin-bottom: 0.25rem;
        }
        .license-value {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.05rem;
            font-weight: 800;
            color: #fbbf24;
            letter-spacing: 0.05em;
        }
        .footer-note {
            font-size: 0.82rem;
            color: #64748b;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="warning-icon">⚠️</div>
        <h1>{{ hata_baslik }}</h1>
        <p>{{ hata_mesaj }}</p>

        <div class="license-box">
            <div class="license-label">Cihaz Lisans Kodu</div>
            <div class="license-value">{{ lisans_kodu }}</div>
        </div>

        <div class="footer-note">
            Lisansınız aktif edildiğinde bu ekran otomatik olarak yayına başlayacaktır. (Her 60 saniyede bir kontrol edilir)
        </div>
    </div>
</body>
</html>
