<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kullanım Kılavuzu & Rehber | Nöbetçi Eczane TV</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css?v=4.4">
    <link rel="stylesheet" href="/static/admin_sidebar.css?v=1.0">
    <style>
        .help-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Üst Gezinme Çubuğu */
        .top-navbar {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            padding: 1rem 1.6rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 2rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .brand-logo {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #9333ea, #c084fc);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
        }

        .brand-text h1 {
            font-size: 1.25rem;
            font-weight: 800;
            margin: 0;
            color: #fff;
        }

        .brand-text p {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin: 0.15rem 0 0 0;
        }

        .nav-actions {
            display: flex;
            gap: 0.8rem;
            align-items: center;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.55rem 1.1rem;
            border-radius: 8px;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            transition: all 0.2s ease;
            text-decoration: none;
            color: #fff;
        }
        .btn-secondary { background: rgba(255, 255, 255, 0.08); border: 1px solid var(--border-color); color: var(--text-main); }
        .btn-secondary:hover { background: rgba(255, 255, 255, 0.14); }

        /* Rehber Kartları */
        .guide-card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 1.6rem 2rem;
            margin-bottom: 1.8rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
        }

        .guide-card h2 {
            font-size: 1.25rem;
            font-weight: 800;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-top: 0;
            margin-bottom: 0.6rem;
        }

        .guide-card p {
            color: #cbd5e1;
            font-size: 0.92rem;
            line-height: 1.65;
            margin-top: 0;
        }

        /* Adım Kutuları */
        .steps-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.2rem;
            margin: 1.2rem 0;
        }

        .step-box {
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.2rem;
            position: relative;
        }

        .step-number {
            width: 32px;
            height: 32px;
            background: rgba(56, 189, 248, 0.15);
            color: var(--color-accent);
            border: 1px solid rgba(56, 189, 248, 0.3);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 1rem;
            margin-bottom: 0.8rem;
        }

        .step-box h3 {
            font-size: 0.95rem;
            font-weight: 700;
            color: #fff;
            margin: 0 0 0.4rem 0;
        }

        .step-box p {
            font-size: 0.82rem;
            color: var(--text-muted);
            line-height: 1.5;
            margin: 0;
        }

        /* Vurgulu Bilgi Kutusu */
        .info-callout {
            background: rgba(56, 189, 248, 0.08);
            border-left: 4px solid var(--color-accent);
            border-radius: 0 10px 10px 0;
            padding: 1rem 1.2rem;
            margin: 1rem 0;
        }

        .info-callout strong {
            color: var(--color-accent);
        }

        /* Özellik Listesi */
        .feature-list {
            list-style: none;
            padding: 0;
            margin: 1rem 0;
        }

        .feature-list li {
            padding: 0.55rem 0;
            display: flex;
            align-items: flex-start;
            gap: 0.6rem;
            font-size: 0.9rem;
            color: #cbd5e1;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
        }

        .feature-list li:last-child {
            border-bottom: none;
        }

        .feature-list .icon {
            font-size: 1.1rem;
            flex-shrink: 0;
            margin-top: 0.1rem;
        }

        /* Kod Blokları */
        code {
            font-family: 'JetBrains Mono', monospace;
            background: rgba(0, 0, 0, 0.45);
            padding: 0.2rem 0.45rem;
            border-radius: 6px;
            color: #38bdf8;
            font-size: 0.85rem;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* Tema Karşılaştırma Izgarası */
        .themes-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        .themes-table th, .themes-table td {
            padding: 0.85rem 1rem;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.88rem;
        }

        .themes-table th {
            color: var(--text-muted);
            text-transform: uppercase;
            font-size: 0.76rem;
            letter-spacing: 0.05em;
            background: rgba(0, 0, 0, 0.25);
        }
</head>
<body class="admin-body">

    <!-- Ortak Sol Menü (Sidebar) -->
    {% include '_admin_sidebar.html' %}

    <!-- Ana İçerik Alanı -->
    <main class="main-wrapper" id="main-content">
        <!-- Mobil Header -->
        <div class="mobile-header">
            <button type="button" class="btn btn-secondary" onclick="toggleMobileSidebar()" style="padding: 0.4rem 0.7rem; font-size: 1.1rem;">
                ☰
            </button>
            <div style="font-weight: 800; color: #fff; font-size: 1.05rem; display: flex; align-items: center; gap: 0.5rem;">
                <span>📖</span> Yardım & Kılavuz
            </div>
            <a href="/admin" class="btn btn-secondary" style="padding: 0.4rem 0.7rem; font-size: 0.8rem;">
                ⬅️
            </a>
        </div>

        <div class="help-container">
            <!-- Sayfa Başlığı -->
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.8rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border-color); flex-wrap: wrap; gap: 1rem;">
                <div>
                    <h1 style="font-size: 1.4rem; font-weight: 800; margin: 0; color: #fff;">📖 Sistem Kullanım Kılavuzu & Rehber</h1>
                    <p style="margin: 0.3rem 0 0 0; color: var(--text-muted); font-size: 0.85rem;">TV Kiosk kurulumu, TV Bro tarayıcı ayarları, lisanslama ve özellikler rehberi</p>
                </div>
            </div>

        <!-- 1. BÖLÜM: 3 Adımda Kolay TV / Mi Box Kurulumu -->
        <section class="guide-card">
            <h2>🚀 3 Adımda Hızlı TV Kurulumu</h2>
            <p>Android TV, Mi Box veya Smart TV cihazınızı birkaç dakika içinde nöbetçi ekranına dönüştürebilirsiniz:</p>

            <div class="steps-grid">
                <div class="step-box">
                    <div class="step-number">1</div>
                    <h3>TV Bro Tarayıcısını Açın</h3>
                    <p>Android TV veya Mi Box'ınıza Google Play Store üzerinden <strong>TV Bro</strong> tarayıcısını kurun ve açın.</p>
                </div>

                <div class="step-box">
                    <div class="step-number">2</div>
                    <h3>Lisans Linkini Girin</h3>
                    <p>Admin panelinden eczanenizin yanındaki <strong>📋 (Kopyala)</strong> butonuna basıp adresi TV Bro'ya yazın. (Örn: <code>/kiosk?key=ECZ-...</code>)</p>
                </div>

                <div class="step-box">
                    <div class="step-number">3</div>
                    <h3>Admin Panelinden Onaylayın</h3>
                    <p>TV ilk açıldığında onay bekler. Admin panelinde <strong>Kiosk</strong> sütunundaki <strong>⚙️ Cihazlar</strong> butonuna basıp <strong>✅ Onayla</strong> butonuna tıklayın. Ekran anında açılır!</p>
                </div>
            </div>

            <div class="info-callout">
                <strong>💡 Önemli İpucu:</strong> TV Bro tarayıcısı kapatılıp açılsa bile sistem cihazı donanımsal parmak izi ve yerel IP'sinden otomatik tanır. Bir daha asla lisans ekranına düşmez ve onay istemez.
            </div>
        </section>

        <!-- 2. BÖLÜM: Mi Box ve TV Çözünürlük & Güvenli Alan Ayarları -->
        <section class="guide-card">
            <h2>📺 Mi Box ve TV Ölçekleme / Çözünürlük & Güvenli Alan</h2>
            <p>TV ekranlarında taşma olmaması, kenar boşluklarının kusursuz oturması ve yazıların uzaktan rahatça okunması için merkezi ölçekleme seçenekleri sunulmuştur:</p>

            <ul class="feature-list">
                <li>
                    <span class="icon">✏️</span>
                    <div>
                        <strong>Manuel Özel Yüzde Girişi (%77, %82, %95 vb.):</strong>
                        Hazır ölçeklerin dışında televizyonunuzun veya monitörünüzün kasasına tam milimetrik oturması için dilediğiniz özel yüzdeyi manuel olarak girebilirsiniz (Örn: <code>%77</code>).
                    </div>
                </li>
                <li>
                    <span class="icon">🛡️</span>
                    <div>
                        <strong>TV Çerçeve Güvenli Alanı (Safe Area Margin):</strong>
                        Bazı televizyon panelleri görüntünün kenarlarını 5-15 piksel kırpabilir (Overscan). Güvenli Alan ayarı ile içeriği <code>0px - 30px</code> arasında içe doğru güvenli sınıra çekebilirsiniz.
                    </div>
                </li>
                <li>
                    <span class="icon">🖥️</span>
                    <div>
                        <strong>Hazır Ön Tanımlı Oranlar:</strong>
                        <code>Mi Box / Kompakt (%80)</code>, <code>HD (%85)</code>, <code>Full HD 1080p (%100)</code> ve <code>4K Vitrin TV (%130)</code> hazır seçenekleriyle tek tıkla standart oranları uygulayabilirsiniz.
                    </div>
                </li>
            </ul>
        </section>

        <!-- 3. BÖLÜM: Çoklu Cihaz, TV Tanımlama ve 10sn Anlık Senkronizasyon -->
        <section class="guide-card">
            <h2>🔔 Çoklu Cihaz Yönetimi & 10 Saniyelik Anında Senkronizasyon</h2>
            <p>Bir eczanede birden fazla ekran olduğunda (Örn: 1 Vitrin TV, 1 Kasa Arkası TV, 1 Danışma Monitörü):</p>

            <ul class="feature-list">
                <li>
                    <span class="icon">⚡</span>
                    <div>
                        <strong>10 Saniyelik Anında Senkronizasyon (Heartbeat):</strong>
                        Admin panelinden veya cihaz ayarlarından tema, harita, ölçek (% zoom), güvenli alan veya kayan yazı değiştirdiğinizde TV ekranının yenilenmesi için 15 dakika beklemeniz gerekmez. Ekran <strong>en geç 10 saniye içinde</strong> yeni ayarları otomatik uygular.
                    </div>
                </li>
                <li>
                    <span class="icon">🏷️</span>
                    <div>
                        <strong>Özel Cihaz İsimlendirmesi:</strong> Cihazlar menüsünden her ekrana istediğiniz adı verebilirsiniz (Örn: <em>Cadde Vitrin TV</em>, <em>Kasa Yanı Box</em>).
                    </div>
                </li>
                <li>
                    <span class="icon">🔔</span>
                    <div>
                        <strong>Ekranda Göster / Tanımla Butonu:</strong> Hangi cihazın hangi fiziksel ekrana ait olduğunu anlamak için listedeki <strong>🔔</strong> butonuna bastığınız anda, hedef TV ekranında 25 saniye boyunca parlayan bir tanımlama bildirimi (<code>CİHAZ #ID</code>) gösterilir.
                    </div>
                </li>
            </ul>
        </section>

        <!-- 4. BÖLÜM: Kiosk Ekran Temaları & Temaya Özel Bağımsız Parametreler -->
        <section class="guide-card">
            <h2>🎨 Kiosk Ekran Temaları & Temaya / Ekrana Özel Bağımsız Parametreler</h2>
            <p>Sistemde temalar artık <strong>hem cihaz hem de tema bazında bağımsız parametrelerle</strong> çalışır. Her ekran görünümü için harita ve bileşen tercihlerini ayrı ayrı özelleştirebilirsiniz:</p>

            <table class="themes-table">
                <thead>
                    <tr>
                        <th>Tema Adı</th>
                        <th>Görsel Yapı & Yenilikler</th>
                        <th>En Uygun Kullanım</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td><strong>1. Klasik 4'lü Izgara & Harita</strong></td>
                        <td>
                            Sol tarafta nöbetçi kartları, sağ tarafta harita. 
                            <strong>15 saniyelik sıralı döngü</strong> ile sıradaki kart parlak mavi çerçeveyle vurgulanır, haritada o eczanenin pini büyüyüp üzerinde mesafe etiketi (örn. "597 mt") belirir. Kendi eczaneniz <strong>⭐ Buradasınız</strong> olarak sabit kalır.
                            <br><small style="color: #38bdf8;">💡 Harita kapatıldığında 4 kart haritanın yerini de kaplayarak 2x2 tam ekrana yayılır.</small>
                        </td>
                        <td>Aynı anda çok sayıda nöbetçiyi tek ekranda ve harita desteğiyle göstermek isteyen eczaneler.</td>
                    </tr>
                    <tr>
                        <td><strong>2. Liste Görünümü</strong></td>
                        <td>Haritasız, tam ekran sade ve okunaklı nöbetçi eczane listesi. 4'ten fazla nöbetçi olduğunda otomatik sayfalanır.</td>
                        <td>Harita istemeyen, doğrudan büyük yazı ve tam ekran liste hedefleyen ekranlar.</td>
                    </tr>
                    <tr>
                        <td><strong>3. Vitrin Carousel & Dev Odak</strong></td>
                        <td>Büyük puntolu dev odak kartı, sokak/cadde yürüyüş rotası (OSRM) ve harita odaklama animasyonu. 15 saniyede bir sıradaki nöbetçiye geçer.</td>
                        <td>Cadde vitrinlerinde uzaktan veya araçtan geçenlerin kolayca okuyabilmesi için idealdir.</td>
                    </tr>
                    <tr>
                        <td><strong>4. İkili Dev Kart & Harita</strong></td>
                        <td>2'den fazla nöbetçi olduğunda <strong>otomatik 2'şerli sayfalama</strong>. Harita o an ekranda görünen nöbetçilere odaklanır.</td>
                        <td>Sade, kalabalıktan uzak ve devasa puntolarla yönlendirme isteyen vitrinler.</td>
                    </tr>
                    <tr>
                        <td><strong>5. Karma Mod (Saatlik Dönüşüm)</strong></td>
                        <td>Zaman ayarlı otomatik dönüşüm (1 &rarr; 2 &rarr; 3 &rarr; 4). Her periyotta temayı ve o temanın özel parametrelerini otomatik devreye sokar.</td>
                        <td>Vitrin ekranında sürekli hareketlilik ve farklı ekran formatları sunmak isteyenler.</td>
                    </tr>
                </tbody>
            </table>

            <div style="margin-top: 1.5rem; padding-top: 1.2rem; border-top: 1px solid var(--border-color);">
                <h3 style="font-size: 1.05rem; color: var(--color-accent); margin-bottom: 0.5rem;">⚙️ Ekrana / Temaya Özel Bağımsız Ayar Yönetimi</h3>
                <p style="font-size: 0.88rem; color: #cbd5e1; line-height: 1.6; margin-bottom: 0.8rem;">
                    Admin panelindeki tema ayarları modalında üstten seçtiğiniz her temanın kendi bağımsız parametre hafızası bulunur:
                </p>
                <ul class="feature-list" style="margin-top: 0.5rem;">
                    <li>
                        <span class="icon">🗺️</span>
                        <div>
                            <strong>Bağımsız Harita Kontrolü:</strong> Örneğin <em>Klasik 4'lü Izgara</em> ekranında haritayı kapatıp kartları tam ekrana yayabilir, <em>Vitrin Carousel (Tekli Kart)</em> ekranında ise haritayı ve rotayı açık bırakabilirsiniz.
                        </div>
                    </li>
                    <li>
                        <span class="icon">🛡️</span>
                        <div>
                            <strong>Pikselleri Koruma Modu (Anti-Burn-In):</strong> TV ve OLED ekranlarda uzun süre sabit yayından kaynaklanan piksel yanması ve iz kalmasını önlemek için mikro seviyede (1-2px) periyodik piksel kaydırma yapar.
                        </div>
                    </li>
                    <li>
                        <span class="icon">📢</span>
                        <div>
                            <strong>Kayan Yazı Hızı (Ticker Speed):</strong> Yaşlı vatandaşların cadde/kaldırımdan rahatça okuyabilmesi için ideal hız <strong>50-60 px/sn</strong> olarak ayarlanabilir. Cümlenin başı önce gelecek şekilde soldan sağa doğal akış sağlar.
                        </div>
                    </li>
                    <li>
                        <span class="icon">⏱️</span>
                        <div>
                            <strong>15 Saniyelik Sıralı Döngü:</strong> Kartlar ve harita pinleri arasında 15 saniyede bir akıcı döngü yapılır.
                        </div>
                    </li>
                </ul>
            </div>
        </section>

        <!-- 5. BÖLÜM: 1 Saatlik Test Nöbeti ve Mesafe Bilgisi -->
        <section class="guide-card">
            <h2>⚡ 1 Saatlik Hızlı Nöbet Testi & Süre Hesapları</h2>
            <p>Gündüz saatlerinde vitrin ekranınızın "Bu Gece Nöbetçiyiz" tasarımını ve uyarılarını test etmek için:</p>

            <ul class="feature-list">
                <li>
                    <span class="icon">⚡</span>
                    <div>
                        <strong>1 Saatlik Nöbet Testi Butonu:</strong> Tablodaki <strong>⚡ (Yeşil)</strong> butonuna bastığınız anda ekran 1 saatliğine test modunda nöbetçi yayınına geçer. Kapatmak istediğinizde <strong>⚡ (Kırmızı)</strong> butonuna basabilirsiniz.
                    </div>
                </li>
                <li>
                    <span class="icon">🚗</span>
                    <div>
                        <strong>Araç & Yürüme Süresi:</strong> Sistem her nöbetçi eczanenin uzaklığına göre hem <strong>araba ile tahmini varış süresini (🚗)</strong> hem de <strong>yürüme süresini (🚶)</strong> otomatik hesaplar ve QR kodunda yürüme navigasyonunu hazır sunar.
                    </div>
                </li>
                <li>
                    <span class="icon">🔄</span>
                    <div>
                        <strong>Resmi Fallback Pipeline:</strong> Sistem verileri sırasıyla 1. İEO Resmi, 2. Eczaneler.gen.tr, 3. Nobetcieczaneler.org kaynaklarından çeker. Biri arızalansa bile ekran asla boş kalmaz.
        <!-- 6. BÖLÜM: Kurum Türleri & Esnek Kiosk Altyapısı -->
        <section class="guide-card">
            <h2>🏢 Kurum Türleri & Çoklu Sağlık Kuruluşu Desteği</h2>
            <p>Sistem yalnızca serbest eczaneler için değil, çok çeşitli sağlık kuruluşları ve kurumlar için esnek multi-tenant altyapıya kavuşturulmuştur:</p>

            <ul class="feature-list">
                <li>
                    <span class="icon">💊</span>
                    <div>
                        <strong>Eczane:</strong> Nöbetçi eczane listesi, harita rotası, QR navigasyonu ve vitrin kayan yazı duyurularını içerir.
                    </div>
                </li>
                <li>
                    <span class="icon">🏥</span>
                    <div>
                        <strong>Hastane & Acil Servis:</strong> Bölgedeki nöbetçi eczaneler, acil yönlendirmeleri ve hastane bilgilendirme ekranları için optimize edilebilir.
                    </div>
                </li>
                <li>
                    <span class="icon">🩺</span>
                    <div>
                        <strong>Tıp Merkezi & 🏢 Poliklinik:</strong> Danışma ve bekleme salonu kioskları için modüler veri yapısına sahiptir.
                    </div>
                </li>
                <li>
                    <span class="icon">⚙️</span>
                    <div>
                        <strong>Genişletilebilir Altyapı:</strong> Kurum bazlı özel ayarlar ve gelecekte eklenecek poliklinik/doktor listeleri için kurum yapılandırma desteği hazırdır.
                    </div>
                </li>
            </ul>
        </section>

        <!-- Alt Gezinme -->
        <div style="text-align: center; margin: 2rem 0 3rem 0;">
            <a href="/admin" class="btn btn-secondary" style="padding: 0.75rem 2rem; font-size: 1rem;">
                ⬅️ Panele Dön
            </a>
        </div>
        </div>
    </main>

</body>
</html>
