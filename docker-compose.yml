version: '3.8'

services:
  eczane:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eczane
    restart: always
    expose:
      - "5000"
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - PORT=5000
      - TZ=Europe/Istanbul
      - DEFAULT_PROVINCE=istanbul
      - DEFAULT_DISTRICT=bahcelievler
      # Önbellek geçerlilik süresi (45 dakika = 2700 saniye)
      - CACHE_TTL=2700
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "coolify.managed=true"
      - "coolify.name=eczane"
      - "coolify.fqdn=https://eczane.cakirlar.net"
      - "traefik.enable=true"
      - "traefik.http.routers.eczane.rule=Host(`eczane.cakirlar.net`)"
      - "traefik.http.routers.eczane.entrypoints=https"
      - "traefik.http.routers.eczane.tls=true"
      - "traefik.http.routers.eczane.tls.certresolver=letsencrypt"
      - "traefik.http.services.eczane.loadbalancer.server.port=5000"
