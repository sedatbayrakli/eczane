version: '3.8'

services:
  eczane:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: eczane
    restart: always
    expose:
      - "5000"
    ports:
      - "${PORT:-5000}:5000"
    volumes:
      # SQLite veritabanının silinmesini önleyen kalıcı veri hacmi
      - pharmacy_data:/data
    environment:
      - PORT=5000
      - TZ=Europe/Istanbul
      - DATABASE_PATH=/data/app.db
      - SECRET_KEY=${SECRET_KEY:-eczane-kiosk-secret-key-2026-secure-random}
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-admin123}
      - DEFAULT_PROVINCE=istanbul
      - DEFAULT_DISTRICT=bahcelievler
      # Önbellek süresi (45 dakika = 2700 saniye)
      - CACHE_TTL=2700
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "coolify.managed=true"
      - "coolify.name=eczane"
      - "coolify.fqdn=https://eczane.cakirlar.net"
      - "traefik.enable=true"
      - "traefik.http.routers.eczane.rule=Host(`eczane.cakirlar.net`)"
      - "traefik.http.routers.eczane.entrypoints=https"
      - "traefik.http.routers.eczane.tls=true"
      - "traefik.http.routers.eczane.tls.certresolver=letsencrypt"
      - "traefik.http.services.eczane.loadbalancer.server.port=5000"

volumes:
  pharmacy_data:
    name: eczane_pharmacy_data
